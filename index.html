<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive neon particle field that morphs between a star and a heart, rendered with Three.js."
    />
    <meta name="author" content="Saklin Ali" />
    <title>Neon Particle Heart</title>

    <!-- Map bare import names to the Three.js CDN build -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
      }
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="container"></div>
    <div class="glow"></div>
    <div id="controls" role="toolbar" aria-label="Display controls"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
